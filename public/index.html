<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>دفتر التنقيط</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=Amiri:wght@400;700&family=Tajawal:wght@500;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#f3f6f7;--card:#fff;--ink:#222;--mut:#667;--teal:#22bfc7;--btn:#22bfc7;--pt:#06292b;--ptp:#06292b;--hdrbg:#2b2b2b;--hdrt:#fff;--hdrb:#22bfc7;--bd:#d5dde0;--tbl:color-mix(in srgb,var(--teal) 16%,var(--card));--r:10px;--ri:7px;--ff:Cairo,Tahoma,sans-serif;--wn:44px;--wl:110px;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1f21;--card:#262b2d;--ink:#eee;--mut:#9ab;--bd:#3a4245}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);background-image:var(--bgi,none);background-attachment:fixed;color:var(--ink);font-family:var(--ff);font-size:16px}
header.top{background:var(--hdrbg);color:var(--hdrt);display:flex;align-items:center;gap:10px;padding:10px 14px;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;border-bottom:1px solid transparent}
header.top b{font-size:20px;color:var(--hdrb)}header.top span{flex:1}
header.top button.g{color:var(--hdrt);border-color:color-mix(in srgb,var(--hdrt) 40%,transparent)}
html[data-hd=light] header.top{border-bottom-color:var(--bd)}
main{max-width:1200px;margin:0 auto;padding:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:14px;margin-bottom:12px}
html[data-card=shadow] .card{border-color:transparent;box-shadow:0 4px 18px rgba(0,0,0,.09)}
html[data-card=flat] .card{border-color:transparent}
html[data-card=accent] .card{border-top:4px solid var(--teal)}
html[data-ut=glass] .card,html[data-ut=glass] header.top{-webkit-backdrop-filter:blur(12px) saturate(1.3);backdrop-filter:blur(12px) saturate(1.3)}
h2{margin:0 0 10px;font-size:18px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row>*{flex:1 1 150px}.row>button,.row>.fit{flex:0 0 auto}
input,select,button{font:inherit;padding:9px 10px;border:1px solid var(--bd);border-radius:var(--ri);background:var(--card);color:var(--ink);min-height:42px}
input[type=checkbox]{min-height:0;width:18px;height:18px;padding:0;accent-color:var(--teal)}
input[type=color]{padding:2px;min-width:56px;cursor:pointer}
button{cursor:pointer;background:var(--btn);color:var(--pt);border:0;font-weight:600}
button.g{background:transparent;color:var(--ink);border:1px solid var(--bd)}button.d{background:#e66;color:#fff}
html[data-btn=soft] button:not(.g):not(.d){background:color-mix(in srgb,var(--btn) 24%,var(--card));color:var(--ink)}
html[data-btn=outline] button:not(.g):not(.d){background:transparent;border:2px solid var(--btn);color:var(--ink)}
html[data-btn=pill] button{border-radius:999px}
.cls{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:10px;border:1px solid var(--bd);border-radius:var(--r);margin-bottom:8px;background:color-mix(in srgb,var(--tbl) 40%,transparent)}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px}.tabs button{background:transparent;color:var(--ink);border:1px solid var(--bd);white-space:nowrap}.tabs button.on{background:var(--teal);color:var(--ptp)}
html[data-btn] .tabs button:not(.on){background:transparent;color:var(--ink);border:1px solid var(--bd)}
html[data-btn] .tabs button.on{background:var(--teal);color:var(--ptp);border:0}
/* ===== الدفتر (يتبع نمط PDF وليس نمط المنصة) ===== */
.sheet{--pp:#22bfc7;--pd:#2b2b2b;--pl:#222;--hn:#f1f1a8;--hl:#bfdff5;--hc:#dcefd8;--hs:#a9d57c;--hf:#e3aaa7;--ht:#9ec4e8;--hm:#cfa9d0;--hu:#dcefd8;--hut:#111;--zbc:#f3f7f8;--tbg:#2b2b2b;--tsoft:#e8f7f8;--tt:#fff;--thi:#ffd75e;--tbd:3px solid #22bfc7;--tf:Cairo,Tahoma,sans-serif;--bw:1px;--fh:22px;--s0:#bfdff5;--s1:#fbe3ee;
background:#fff;color:#111;border:1px solid var(--bd);border-radius:6px;overflow:hidden}
.band{display:flex;justify-content:space-between;align-items:stretch;background:var(--pp);color:#fff;font-weight:800;font-size:20px}
.band .a{background:var(--pd);padding:8px 18px;clip-path:polygon(0 0,100% 0,88% 100%,0 100%);padding-left:30px}
.band .b{padding:8px 18px}
.sheet[data-band=flat] .band .a{clip-path:none;padding-left:18px}
.sheet[data-band=round] .band{margin:8px 10px 0;border-radius:999px;overflow:hidden}
.sheet[data-band=round] .band .a{clip-path:none;padding-left:18px;border-radius:999px}
.meta{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px 20px;padding:10px 14px;font-weight:600}
.meta .r{color:#d00}
.ttl{margin:12px 14px 6px;padding:14px 26px;min-height:72px;display:flex;align-items:center;justify-content:center;text-align:center;font-family:var(--tf);font-weight:800;font-size:28px;line-height:1.5;background:var(--tbg);color:var(--tt);border:var(--tbd);border-radius:14px;box-shadow:0 2px 6px rgba(0,0,0,.18)}
.ttl i{color:var(--thi);font-style:normal}
.sheet[data-ts=pill] .ttl{border-radius:999px;padding:14px 40px}
.sheet[data-ts=sq] .ttl{border-radius:3px}
.sheet[data-ts=dbl] .ttl{border-radius:10px;background:var(--tsoft);color:var(--pd);border:6px double var(--pp);box-shadow:none}
.sheet[data-ts=dbl] .ttl i{color:var(--pp)}
.sheet[data-ts=line] .ttl{background:none;color:var(--pd);border:0;border-bottom:4px solid var(--pp);border-radius:0;box-shadow:none}
.sheet[data-ts=line] .ttl i{color:var(--pp)}
@media(max-width:600px){.ttl{font-size:20px;padding:10px 14px;min-height:54px}.sheet[data-ts=pill] .ttl{padding:10px 20px}}
.mut{color:var(--mut);font-size:14px}.cat{display:grid;grid-template-columns:2fr 80px 44px 44px;gap:6px;margin-bottom:6px}
.wrap{overflow:auto;max-height:70vh;padding:0 8px 8px}
table.g{border-collapse:collapse;width:100%;table-layout:fixed;font-size:15px}
.g th,.g td{border:var(--bw) solid var(--pl);padding:0;text-align:center;vertical-align:middle;height:34px}
.g th{font-weight:600}.g .v{height:150px;min-width:0}.g .v div{display:inline-block;vertical-align:middle;writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap;padding:4px;line-height:1.4;text-align:center}
.g td.n{background:#fff;font-style:italic}.g td.n,.g td.nm,.g td.ro{vertical-align:middle;line-height:1.2}.g td.nm{text-align:center;vertical-align:middle;padding:0 8px;white-space:nowrap;background:#fff}
.g td.n,.g th.n{position:sticky;right:0;z-index:2}.g td.l,.g th.l{position:sticky;right:var(--wn);z-index:2}
.g .f{position:sticky;right:calc(var(--wn) + var(--wl));z-index:2}
.g th.n{background:var(--hn)}.g th.l,.g th.f{background:var(--hl)}.g th.c{background:var(--hc)}.g th.s{background:var(--hs)}.g th.fr{background:var(--hf)}.g th.t{background:var(--ht)}.g th.m{background:var(--hm)}
.sheet[data-hs=uni] .g th:not(.e){background:var(--hu)!important;color:var(--hut)}
.sheet[data-hs=dark] .g th:not(.e){background:var(--pd)!important;color:#fff}
.sheet[data-hs=under] .g th:not(.e){background:#fff!important;border-bottom:3px solid var(--pp)}
.sheet[data-bd=soft]{--bw:1px}.sheet[data-bd=soft] .g th,.sheet[data-bd=soft] .g td{border-color:#9aa5ab}
.sheet[data-bd=thin]{--bw:.6px}.sheet[data-bd=bold]{--bw:1.6px}
.sheet[data-bd=h] .g th:not(.e),.sheet[data-bd=h] .g td{border-left:0;border-right:0}
.sheet[data-zb="1"] .g tbody tr:nth-child(even) td{background:var(--zbc)}
.g td input{display:block;margin:auto;width:100%;min-width:0;border:0;border-radius:0;text-align:center;background:transparent;color:#111;padding:4px 2px;min-height:34px;font-size:16px}
.g td input:focus{outline:2px solid var(--teal);background:#fffbe0}.g td.bad input{background:#fcc}
.g td.ro{font-weight:800}.g td.pass{color:#0a7a2f}.g td.fail{color:#c00}
.st{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px;padding:8px}
.st div{border:var(--bw) solid var(--pl);padding:6px 8px;display:flex;justify-content:center;align-items:center;text-align:center;gap:10px;font-weight:600;border-radius:4px}
.st .a1{background:var(--s1)}.st .a2{background:#a9d57c}.st .a3{background:#f4a29d}.st .a0{background:var(--s0)}
.sheet[data-th=academic]{border:3px double var(--pd)}
.sheet::after{content:"";display:block;height:var(--fh);background:linear-gradient(to left,var(--pd) 45%,var(--pp) 45%)}
/* الإحصائيات والمخططات */
#stt{padding:0 8px 10px}
.sth{margin:14px 6px 6px;padding:9px 16px;border-radius:10px;background:var(--pp);color:#fff;font-weight:800;font-size:19px;text-align:center;font-family:var(--tf)}
.sheet[data-ts=sq] .sth{border-radius:3px}.sheet[data-ts=pill] .sth{border-radius:999px}
.chs{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:10px;padding:8px 6px}
.ch{border:1px solid #c9d1d6;border-top:5px solid var(--pp);border-radius:10px;padding:8px 10px 10px;background:#fff;break-inside:avoid}
.ch h4{margin:0 0 4px;text-align:center;font-size:15px;color:var(--pd)}
.ch svg{display:block;width:100%;height:auto;direction:ltr}
.lg{display:flex;flex-wrap:wrap;gap:4px 12px;justify-content:center;font-size:12px;margin-top:4px}.lg span{display:inline-flex;align-items:center;gap:4px}.lg i{width:10px;height:10px;border-radius:2px;display:inline-block}
.emp{text-align:center;color:#667;padding:28px 10px;font-size:14px;line-height:1.7}
.hid{display:none}col.cn{width:44px}col.cl{width:110px}.imp td,.imp th{padding:4px 8px}.sheet .imp th{background:var(--tbl);color:var(--ink)}.ok{color:#0a7a2f}.er{color:#c00}
@media(max-width:600px){:root{--wl:90px}col.cl{width:90px}main{padding:8px}.band{font-size:16px}}
/* لوحات الإعدادات */
.pset h3{font-size:15px;margin:14px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-weight:600}
button.chip.on,label.chip:has(input:checked){outline:2px solid var(--teal);outline-offset:-2px}
.sw{display:inline-block;width:14px;height:14px;border-radius:50%;border:1px solid rgba(0,0,0,.25)}
.cp{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:14px}
.pv{margin-top:6px;pointer-events:none}.pv .g th,.pv .g td{height:28px;font-size:13px}.pv .ttl{font-size:20px;min-height:52px;padding:8px 16px}.pv td input{display:none}
#um{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);display:flex;align-items:flex-start;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 12px) 10px 12px;overflow:auto}
#um .box{background:var(--card);color:var(--ink);border:1px solid var(--bd);border-radius:var(--r);width:min(760px,100%);padding:14px;margin:auto}
html[data-ut=glass] #um .box{background:var(--bg)}
#um .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}
@media print{.sj{display:none!important}table.g{min-width:0!important}@page{margin:8mm}body{background:#fff!important;background-image:none!important}header.top,.noprint,.card,#um{display:none!important}main{max-width:none;padding:0}.sheet{border:0}.sheet[data-th=academic]{border:3px double var(--pd)}.wrap{max-height:none;overflow:visible}.g td,.g th{position:static!important}.g td input{font-size:13px}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}.pb{display:block!important}.ttl{font-size:26px}.chs{grid-template-columns:1fr 1fr}.chs[data-n="1"]{grid-template-columns:1fr}.st div{padding:3px 8px;font-size:13px}.st{padding:4px 8px}.sth{margin-top:2px}#stt{break-before:page}thead{display:table-header-group}tr{break-inside:avoid}}
.pb{display:none}
/* لوحة الإحصائيات المتخصصة */
.nsn{padding:0 14px;color:#556;font-size:13px;font-weight:600}
.nsk{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;padding:8px 14px}
.nsk div{border:1px solid #d5dde0;border-top:4px solid var(--pp);border-radius:8px;padding:8px 10px;background:#fff;color:#111;display:flex;flex-direction:column;gap:2px}
.nsk div span{font-size:13px;color:#556}.nsk div b{font-size:22px}
.nsk .ok2{border-top-color:#43a982}.nsk .no2{border-top-color:#d64545}
.nsg{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;padding:8px 14px 14px;align-items:start}
.nsch{padding:10px;border:1px solid #d5dde0;border-radius:8px;break-inside:avoid;min-width:0}.nsch h4{margin:0 0 6px;font-size:17px}
.nsc,.nsw{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%}.nsc svg{display:block;width:100%;max-width:1300px;height:auto;margin:0 auto}
.nsc .lg{min-width:0;flex-wrap:wrap}
.nst{width:100%;min-width:420px;border-collapse:collapse;font-size:15px}.nst th,.nst td{border:1px solid #d5dde0;padding:6px 10px;text-align:start}.nst th{background:var(--hn);color:#111}
.nst td i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-inline-end:8px;vertical-align:middle}.nst td:last-child{width:30%}.nst u{display:block;height:10px;border-radius:5px}
@media print{.nsx+.nsx{break-before:page}.nsc,.nsw{overflow:visible}.nsc svg{min-width:0!important}.nst{min-width:0}.nsg{grid-template-columns:minmax(0,1fr)}}
/* محرر المعادلة */
.fed{border:1px solid var(--bd);border-radius:var(--r);padding:12px;margin-top:14px;background:color-mix(in srgb,var(--tbl) 30%,transparent)}
.fed h3{margin:0 0 6px;font-size:18px}.fed h4{margin:12px 0 4px;font-size:14px;color:var(--mut)}
.fp{display:flex;flex-wrap:wrap;gap:6px;direction:ltr;justify-content:flex-end}
.fz{display:flex;flex-wrap:wrap;align-items:center;gap:2px;min-height:70px;padding:10px;border:2px dashed var(--teal);border-radius:var(--ri);background:var(--card)}
.fc{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;min-width:36px;min-height:38px;padding:3px 10px;border-radius:8px;border:1px solid var(--bd);cursor:pointer;font-weight:700;font-size:19px;line-height:1.1;user-select:none;color:#111}
.fc.pal{cursor:grab}.fc small{font-size:10px;font-weight:600;font-family:var(--ff);color:#445}
.fc.var{background:#dff3e0;border-color:#9ccc9f}.fc.op{background:#ffe9c7;border-color:#e8c27a}.fc.par{background:#e3e3f7;border-color:#b5b5e0}.fc.num{background:#dbeaf8;border-color:#9fc3e8}
.fc.sel{outline:3px solid var(--teal);outline-offset:1px}.fc.bad{outline:3px solid #d33;background:#ffd9d9}.fc.dov{box-shadow:-6px 0 0 #f5a623}
.fg{display:inline-block;width:8px;height:40px;border-radius:4px;cursor:text}.fg.cur{background:var(--teal);animation:fbl 1s steps(2) infinite}.fg.dov{background:#f5a623;width:16px}
@keyframes fbl{50%{opacity:.2}}
.fm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:21px;font-weight:700;padding:10px;border:1px solid var(--bd);border-radius:var(--ri);background:var(--card)}
.fm .mv{background:color-mix(in srgb,var(--teal) 20%,var(--card));padding:1px 8px;border-radius:6px;font-size:17px}.fm .mo{color:#c26a00}
.fs{margin-top:8px;font-weight:700}.fs.ok{color:#0a7a2f}.fs.er{color:#c00}

/* ===== تصدير PDF المرن ===== */
#pxd{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.45);display:flex;align-items:flex-start;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 12px) 10px 12px;overflow:auto}
#pxd .box{background:var(--card);color:var(--ink);border:1px solid var(--bd);border-radius:var(--r);width:min(680px,100%);padding:14px;margin:auto}
html[data-ut=glass] #pxd .box{background:var(--bg)}
#pxd h3{font-size:15px;margin:14px 0 6px}
#pxd .pxl2{max-height:260px;overflow:auto;border:1px solid var(--bd);border-radius:8px;padding:6px;display:grid;gap:4px}
#pxd .pxl2 label{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:6px;cursor:pointer}
#pxd .pxl2 label:hover{background:rgba(127,127,127,.12)}
#pxd .pxl2 label.ar{opacity:.65}
#pxd .pxsel{display:flex;flex-wrap:wrap;gap:6px;min-height:30px}
#pxd .pxsel span{background:rgba(127,127,127,.15);border-radius:999px;padding:3px 10px;font-size:13px}
#pxd button:disabled{opacity:.5;cursor:not-allowed}
#pxo{display:none}
.pxs{break-after:page}.pxs:last-child{break-after:auto}.pxs.p{page:pxp}.pxs.l{page:pxl}
.pxsub{text-align:center;font-weight:700;margin:4px 0 6px}
@page pxp{size:A4 portrait;margin:8mm}
@page pxl{size:A4 landscape;margin:8mm}
@media print{body.pxm main,body.pxm header.top{display:none!important}body.pxm #pxo{display:block}#pxd{display:none!important}.pxs .wrap{overflow:visible!important;max-height:none!important}.pxs table.g{width:100%}.pxs .g td span{font-size:13px}}

/* ===== تذييل المنصة الدائم (حقوق التصميم) ===== */
body{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
header.top{flex:0 0 auto}
main{width:100%;flex:1 0 auto}
#ft{flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:8px;padding:10px 14px;font-size:13px;font-weight:600;line-height:1.5;color:var(--mut);background:var(--card);border-top:1px solid var(--bd);text-align:center}
#ft b{color:var(--ink);font-weight:800}
#ft i{font-style:normal;color:var(--teal)}
@media print{#ft,#tst,#pgm{display:none!important}}

/* ===== إشعارات التصدير ===== */
#tst{position:fixed;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:90;display:flex;justify-content:center;padding:0 12px;pointer-events:none}
#tst:empty{display:none}
.tsb{pointer-events:auto;display:flex;align-items:center;gap:10px;max-width:min(580px,100%);padding:10px 14px;border-radius:12px;background:#1f2a2d;color:#fff;box-shadow:0 6px 24px rgba(0,0,0,.28);font-size:15px;font-weight:600;line-height:1.5;border-inline-start:5px solid var(--teal)}
.tsb.ok{border-inline-start-color:#2fb36a}.tsb.er{border-inline-start-color:#e5484d}
.tsb .tsi{font-weight:800;flex:0 0 auto}
.tsb button{min-height:32px;padding:4px 10px;color:#fff;border:1px solid rgba(255,255,255,.4);background:transparent;flex:0 0 auto;font-size:13px}

/* ===== صفحات PDF المباشر: تصميم ثابت يغطي كامل الصفحة (مستقل عن طول الجدول) ===== */
#pgm{position:fixed;left:-30000px;top:0;visibility:hidden;pointer-events:none}
.pgx{position:relative;overflow:hidden;border:0!important;border-radius:0!important;background:#fff;color:#111;direction:rtl;font-family:Cairo,Tahoma,sans-serif}
.pgx::after{display:none!important}
.pgfr{position:absolute;top:0;right:0;bottom:0;left:0;z-index:0}
.pgfr::before,.pgfr::after{content:"";position:absolute;top:0;bottom:0;width:8px;background:linear-gradient(to bottom,var(--pp),var(--pd))}
.pgfr::before{right:0}.pgfr::after{left:0}
.pgx[data-th=academic] .pgfr{top:6px;right:6px;bottom:6px;left:6px;border:3px double var(--pd)}
.pgx[data-th=academic] .pgfr::before,.pgx[data-th=academic] .pgfr::after{display:none}
.pgh{position:absolute;top:0;left:0;right:0;z-index:2}
.pgh .meta{padding:6px 28px}
.pgh .ttl{margin:8px 26px 4px;padding:8px 22px;min-height:58px;font-size:24px}
.pgh .pxsub{margin:2px 0 0}
.pgb{position:absolute;left:26px;right:26px;z-index:1;overflow:hidden}
.pgblk{display:flow-root}
.pgf{position:absolute;left:0;right:0;bottom:0;z-index:2}
.pgc{display:flex;justify-content:space-between;align-items:center;margin:0 26px;height:30px;font-size:13px;font-weight:800;color:var(--pd);border-top:1.5px solid var(--pp)}

<script>
const K='dtq1',$=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,9),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S=null;const DEF=()=>({p:{season:'2026/2027',term:'1',type:'متوسطة'},cl:[]});let cur=null,sub=null,fs='',ft='',sa=0,nsOn=false;

const sv=x=>{const e=$('#sv');if(e)e.textContent=x};

const save=()=>{if(nsOn)nsLive();if(!ME||ME.role!='teacher')return;sv('جارٍ الحفظ…');clearTimeout(tm);tm=setTimeout(push,500)};

function homeView(){
const p=S.p,seasons=[...new Set(S.cl.map(c=>c.season))],f=S.cl.filter(c=>(!fs||c.season==fs)&&(!ft||c.term==ft)&&(!!c.ar==!!sa));
$('#app').innerHTML=`<div class="card"><h2>بيانات الأستاذ</h2><div class="row">

<input placeholder="مديرية التربية" value="${esc(p.dir)}" oninput="S.p.dir=this.value;save()">

<select onchange="ft=this.value;render()"><option value="">كل الفصول</option>${[1,2,3].map(i=>`<option value="${i}" ${ft==i?'selected':''}>الفصل ${TN[i]}</option>`).join('')}</select>
<select onchange="sa=+this.value;render()"><option value="0">الأقسام الحالية</option><option value="1" ${sa?'selected':''}>المؤرشفة</option></select><button class="fit" onclick="addClass()">+ قسم جديد</button><button class="fit g" onclick="pxOpen()">تصدير PDF</button></div><div style="margin-top:10px">
${f.map(c=>`<div class="cls"><div><b>${esc(c.name)}</b><div class="mut">${esc(c.season)} · الفصل ${TN[c.term]} · ${c.st.length} تلميذ</div></div>
<div class="row"><button class="fit" onclick="openC('${c.id}')">فتح</button><button class="fit g" onclick="copyC('${c.id}')">نسخ</button><button class="fit g" onclick="renC('${c.id}')">تعديل</button><button class="fit g" onclick="arC('${c.id}')">${c.ar?'استرجاع':'أرشفة'}</button><button class="fit d" onclick="delC('${c.id}')">حذف</button></div></div>`).join('')||'<p class="mut">لا توجد أقسام. أنشئ قسمك الأول.</p>'}</div></div>
<div class="card"><h2>قوائم التلاميذ (Excel)</h2><div class="row"><button class="fit g" onclick="tpl()">تحميل نموذج Excel</button><button class="fit" onclick="$('#hx').click()">استيراد قوائم التلاميذ</button><input id="hx" type="file" class="hid" accept=".xlsx,.xls,.csv" onchange="xs(this,1)"></div><p class="mut">املأ عمود «القسم» لكل تلميذ؛ تُوزَّع القوائم على الأقسام الحالية (نفس الموسم والفصل)، وتُنشأ الأقسام غير الموجودة بعد تأكيدك.</p><div id="ip"></div></div>
<div class="card"><h2>نسخة احتياطية</h2><div class="row"><button class="fit g" onclick="bk()">تنزيل نسخة احتياطية</button><button class="fit g" onclick="$('#rf').click()">استرجاع نسخة</button><button class="fit g" onclick="snaps()">استرجاع من نسخ الخادم</button><input id="rf" type="file" class="hid" accept=".json" onchange="rs(this)"></div>
<p class="mut">تُحفظ بياناتك تلقائياً في قاعدة البيانات على الخادم، مع نسخة يومية لآخر 14 يوماً.</p><details><summary>سجل التعديلات (آخر 50)</summary>${(S.log||[]).slice(-50).reverse().map(l=>`<div class="mut">${new Date(l.t).toLocaleString('ar-DZ')} · ${esc(l.a)}</div>`).join('')||'<div class="mut">لا توجد تعديلات.</div>'}</details></div>`}
const subjHint=()=>{for(const c of S.cl)for(const b of c.sub)if(b.name&&b.name!='المادة')return b.name;return''},curSubj=()=>S.p.subject||subjHint()||'المادة';
function setSubj(v){v=String(v||'').trim();if(ME&&ME.subject)v=ME.subject;if(!v)return;S.p.subject=v;S.cl.forEach(c=>{if(c.sub.length==1)c.sub[0].name=v});save();render()}
function addClass(){const n=prompt('اسم القسم (مثال: 4 متوسط 3)');if(!n)return;const c={id:uid(),name:n,season:S.p.season,term:S.p.term,sort:'orig',st:[],sub:[]};c.sub.push(newSub(curSubj()));S.cl.push(c);save();openC(c.id)}
function newSub(n){return{id:uid(),name:n,formula:'(cc+f+t*2)/4',cats:['الاستجواب الكتابي 01','الاستجواب الكتابي 02','الوظائف','الكراس','المشاركة والسلوك'].map(x=>({id:uid(),name:x,max:4,on:1})),m:{}}}
function openC(id){nsOn=false;cur=S.cl.find(c=>c.id==id);if(!cur.sub.length){cur.sub.push(newSub(curSubj()));save()}sub=cur.sub[0]?.id;render();scrollTo(0,0)}
function arC(id){const c=S.cl.find(c=>c.id==id);c.ar=c.ar?0:1;save();render()}
function mvSt(id){const o=S.cl.filter(c=>c!=cur&&!c.ar);if(!o.length)return alert('لا يوجد قسم آخر');const t=o[(+prompt('انقل إلى (أدخل الرقم):\n'+o.map((c,i)=>`${i+1}- ${c.name} (${c.season} ف${c.term})`).join('\n')))-1];if(!t)return;const s=cur.st.find(x=>x.id==id);if(!confirm('نقل '+s.ln+' '+s.fn+' إلى '+t.name+'؟ نقاطه في هذا القسم ستُحذف.'))return;t.st.push({...s,id:uid()});cur.st=cur.st.filter(x=>x.id!=id);cur.sub.forEach(b=>delete b.m[id]);save();render();studs()}
function renC(id){const c=S.cl.find(c=>c.id==id),n=prompt('اسم القسم',c.name);if(n){c.name=n;save();render()}}
function delC(id){if(confirm('حذف القسم وكل نقاطه نهائياً؟')){S.cl=S.cl.filter(c=>c.id!=id);save();render()}}
function copyC(id){const c=S.cl.find(c=>c.id==id),s=prompt('الموسم الدراسي للنسخة',c.season);if(!s)return;const t=prompt('الفصل (1 أو 2 أو 3)',String(Math.min(3,+c.term+1)));if(!['1','2','3'].includes(t))return alert('فصل غير صحيح');
const ids={},n={id:uid(),name:c.name,season:s,term:t,sort:c.sort,st:c.st.map(x=>{const y={...x,id:uid()};ids[x.id]=y.id;return y}),sub:c.sub.map(b=>({...JSON.parse(JSON.stringify(b)),id:uid(),m:{}}))};
S.cl.push(n);save();alert('تم النسخ. القائمة والإعدادات نُسخت والنقاط فارغة، والقسم الأصلي لم يتغير.');render()}
function bk(){S.lb=Date.now();save();const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='dafter-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click()}
function rs(i){const f=i.files[0];if(!f)return;f.text().then(t=>{try{const d=JSON.parse(t);if(!d.cl)throw 0;if(confirm('استبدال البيانات الحالية بالنسخة المحددة؟')){if(!d.prefs&&S.prefs)d.prefs=S.prefs;S=d;save();render()}}catch(e){alert('ملف غير صالح')}})}
const B=()=>cur.sub.find(s=>s.id==sub);
const ord=()=>cur.sort=='alpha'?[...cur.st].sort((a,b)=>(a.ln+' '+a.fn).localeCompare(b.ln+' '+b.fn,'ar')):cur.st;
const num=v=>{if(v===''||v==null)return null;const n=parseFloat(String(v).replace(',','.'));return isNaN(n)?null:n};
const r2=v=>Math.round(+(v*100).toPrecision(12))/100,fa=v=>{if(v==null||v===''||isNaN(v))return'';if(r2(v)==0)return'00.0';const t=r2(v).toFixed(2);return t.endsWith('0')?t.slice(0,-1):t};
const nf=x=>String(x??'').normalize('NFKC').replace(/[\u200b-\u200f\u202a-\u202e\u2066-\u2069\ufeff]/g,'').replace(/[٠-٩]/g,c=>c.charCodeAt(0)-0x660).replace(/[۰-۹]/g,c=>c.charCodeAt(0)-0x6f0).replace(/[٫،]/g,'.').replace(/[×·]/g,'*').replace(/÷/g,'/').replace(/[−–—]/g,'-').replace(/[\[{]/g,'(').replace(/[\]}]/g,')');
/* ===== محرك المعادلات: محلل رياضي آمن (بدون eval ولا Function — لأن سياسة الأمان CSP تمنعهما) ===== */
const FDEF='(cc+f+t*2)/4',OPD={'+':'+','-':'−','*':'×','/':'÷'},
FV=b=>[{k:'cc',n:'المراقبة المستمرة (المجموع)',s:'مراقبة'},{k:'f',n:'الفرض',s:'الفرض'},{k:'t',n:'الاختبار',s:'الاختبار'},...b.cats.map((c,i)=>({k:'k'+(i+1),n:c.name+' ('+c.max+' ن)'+(c.on?'':' — معطّلة'),s:c.name}))];
function fTok(src){const s=nf(src),T=[];let i=0;
 while(i<s.length){const ch=s[i];if(/\s/.test(ch)){i++;continue}
  let m=/^(\d+\.?\d*|\.\d+)/.exec(s.slice(i));if(m){T.push({t:'num',v:m[1]});i+=m[1].length;continue}
  m=/^[a-z]+\d*/i.exec(s.slice(i));if(m){T.push({t:'var',v:m[0].toLowerCase()});i+=m[0].length;continue}
  if('+-*/'.includes(ch)){T.push({t:'op',v:ch});i++;continue}
  if(ch=='('||ch==')'){T.push({t:'par',v:ch});i++;continue}
  throw{msg:'رمز غير مسموح: «'+ch+'»',pos:T.length}}
 return T}
function fParse(T,vars){let p=0;const err=(msg,pos)=>{throw{msg,pos}};
 function expr(){let a=term();while(p<T.length&&T[p].t=='op'&&(T[p].v=='+'||T[p].v=='-')){const op=T[p].v,i=p++;a={n:'bin',op,a,b:term(),i}}return a}
 function term(){let a=un();while(p<T.length&&T[p].t=='op'&&(T[p].v=='*'||T[p].v=='/')){const op=T[p].v,i=p++;a={n:'bin',op,a,b:un(),i}}return a}
 function un(){if(p<T.length&&T[p].t=='op'&&(T[p].v=='-'||T[p].v=='+')){const op=T[p++].v,a=un();return op=='-'?{n:'neg',a}:a}return prim()}
 function prim(){const k=T[p];
  if(!k)err('المعادلة غير مكتملة: تنتهي بعملية وينقص بعدها رقم أو متغير',T.length-1);
  if(k.t=='num'){p++;return{n:'num',v:parseFloat(k.v)}}
  if(k.t=='var'){if(vars&&!vars.has(k.v))err('متغير غير معروف: «'+k.v+'»',p);p++;return{n:'var',k:k.v}}
  if(k.t=='par'&&k.v=='('){const o=p++;if(T[p]&&T[p].t=='par'&&T[p].v==')')err('قوسان فارغان بلا محتوى',p);const e=expr();if(T[p]&&T[p].v!=')')err('ينقص رمز عملية (+ − × ÷) قبل هذا العنصر',p);if(!T[p])err('قوس مفتوح لم يُغلق',o);p++;return e}
  if(k.t=='par')err('قوس إغلاق في غير موضعه (ينقص رقم أو متغير قبله)',p);
  err('عملية غير مكتملة عند «'+OPD[k.v]+'»: ينقص رقم أو متغير قبلها',p)}
 if(!T.length)err('المعادلة فارغة',0);
 const r=expr();
 if(p<T.length){const k=T[p];err(k.t=='par'&&k.v==')'?'قوس إغلاق زائد بلا قوس مفتوح':'ينقص رمز عملية (+ − × ÷) قبل هذا العنصر',p)}
 return r}
function fConst(a){if(a.n=='num')return a.v;if(a.n=='var')return null;if(a.n=='neg'){const x=fConst(a.a);return x==null?null:-x}
 const x=fConst(a.a),y=fConst(a.b);if(x==null||y==null)return null;return a.op=='+'?x+y:a.op=='-'?x-y:a.op=='*'?x*y:(y===0?null:x/y)}
function fZero(a){if(a.n=='num'||a.n=='var')return null;if(a.n=='neg')return fZero(a.a);
 if(a.op=='/'&&fConst(a.b)===0)return a.i;return fZero(a.a)??fZero(a.b)}
function fCheck(T,b){try{const ast=fParse(T,new Set(FV(b).map(x=>x.k))),z=fZero(ast);if(z!=null)return{ok:false,msg:'قسمة على صفر: المقسوم عليه يساوي 0 دائماً',pos:z};return{ok:true,ast}}catch(e){return{ok:false,msg:e.msg||'صيغة غير صالحة',pos:e.pos??0}}}
function fEval(a,E){if(a.n=='num')return a.v;if(a.n=='var')return E[a.k]??0;if(a.n=='neg')return-fEval(a.a,E);
 const x=fEval(a.a,E),y=fEval(a.b,E);if(a.op=='+')return x+y;if(a.op=='-')return x-y;if(a.op=='*')return x*y;if(y===0)throw{msg:'قسمة على صفر',pos:a.i};return x/y}
const FC=new Map(),fSer=T=>T.map(t=>t.v).join('');
function fComp(src,b){const key=String(src)+'|'+b.cats.length;let r=FC.get(key);if(r)return r;
 try{r=fCheck(fTok(src||FDEF),b)}catch(e){r={ok:false,msg:e.msg,pos:e.pos}}if(FC.size>200)FC.clear();FC.set(key,r);return r}
function fEnv(b,m,cc,f,t){const E={cc:cc??0,f:f??0,t:t??0};b.cats.forEach((k,i)=>{E['k'+(i+1)]=k.on?(num(m.c?.[k.id])??0):0});return E}
function calc(b,id){const m=b.m[id]||{},cs=b.cats.filter(c=>c.on),vs=cs.map(c=>num(m.c?.[c.id])).filter(v=>v!=null),cc=vs.length?r2(vs.reduce((a,x)=>a+x,0)):null,f=num(m.f),t=num(m.t);let av=null;
if(cc!=null||f!=null||t!=null){const k=fComp(b.formula,b);if(k.ok){try{const r=fEval(k.ast,fEnv(b,m,cc,f,t));if(isFinite(r))av=r2(r)}catch(x){}}}return{cc,f,t,av}}
/* ===== محرر تركيب معادلة المعدل الفصلي للمادة ===== */
let FE={sid:null,T:[],caret:0,sel:-1,rep:0,pv:{},note:'',res:''};
function feInit(b){FE={sid:b.id,T:[],caret:0,sel:-1,rep:0,pv:{},note:'',res:''};try{FE.T=fTok(b.formula||FDEF)}catch(e){FE.note='⚠ المعادلة المحفوظة غير صالحة ('+e.msg+'). ركّب معادلة جديدة واعتمدها.'}FE.caret=FE.T.length}
const feTxt=(t,V)=>t.t=='var'?`<b>${t.v}</b><small>${esc(((V.find(x=>x.k==t.v)||{}).s||'؟').slice(0,13))}</small>`:t.t=='op'?OPD[t.v]:t.v;
function feRender(){const e=$('#fe');if(!e)return;const b=B(),V=FV(b),T=FE.T,ck=fCheck(T,b),bad=ck.ok?-1:ck.pos;
 const pal=(t,v,l,x)=>`<span class="fc ${t} pal" role="button" tabindex="0" draggable="true" ondragstart="feDS(event,'new','${t}','${v}')" onclick="${t=='num'?`feDig('${v}')`:`feAdd('${t}','${v}')`}" title="${esc(x||'')}">${l}</span>`;
 const gap=i=>`<i class="fg ${FE.caret==i?'cur':''}" onclick="feCaret(${i})" ondragover="feOv(event)" ondragleave="feLv(event)" ondrop="feDrop(event,${i})"></i>`;
 let zone=gap(0);T.forEach((t,i)=>{zone+=`<span class="fc ${t.t} ${i==FE.sel?'sel':''} ${i==bad?'bad':''}" draggable="true" ondragstart="feDS(event,'mv',${i})" onclick="feSel(${i})" ${t.t=='num'?`ondblclick="feNum(${i})" title="انقر مرتين لتغيير الرقم"`:''} ondragover="feOv(event)" ondragleave="feLv(event)" ondrop="feDrop(event,${i})">${feTxt(t,V)}</span>`+gap(i+1)});
 const used=[...new Set(T.filter(t=>t.t=='var'&&V.some(x=>x.k==t.v)).map(t=>t.v))];
 const math=T.length?T.map(t=>t.t=='var'?`<bdi class="mv">${esc((V.find(x=>x.k==t.v)||{s:'؟'}).s)}</bdi>`:t.t=='op'?`<span class="mo">${OPD[t.v]}</span>`:`<span>${t.v}</span>`).join(''):'<span class="mut">— المعادلة فارغة —</span>';
 e.innerHTML=`<div class="fed"><h3>تركيب معادلة المعدل الفصلي للمادة</h3>
<p class="mut">اسحب الرموز والمتغيرات إلى مساحة المعادلة، أو انقر عليها لإضافتها عند المؤشر (الخط الوامض). انقر على عنصر لتحديده ثم احذفه أو غيّر مكانه أو استبدله.</p>
<h4>المتغيرات (مرتبطة بنقاط كل تلميذ)</h4><div class="fp">${V.map(v=>pal('var',v.k,`<b>${v.k}</b><small>${esc(v.s.slice(0,13))}</small>`,v.n)).join('')}</div>
